<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d16">
<title>Paperboy</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="game" width="256" height="240" tabindex="0" aria-label="Paperboy game"></canvas></div>
  <div id="touch" hidden>
    <div class="dpad" aria-label="Steering">
      <button class="b up" data-key="up" aria-label="Faster">&#9650;</button>
      <button class="b left" data-key="left" aria-label="Left">&#9664;</button>
      <button class="b right" data-key="right" aria-label="Right">&#9654;</button>
      <button class="b down" data-key="down" aria-label="Brake">&#9660;</button>
    </div>
    <div class="mid">
      <button class="s" data-act="confirm">START</button>
      <button class="s" data-act="pause">PAUSE</button>
      <button class="s" data-act="mute">MUTE</button>
    </div>
    <button class="b throw" data-act="throw" aria-label="Throw paper">THROW</button>
  </div>
</div>
<script src="sprites.js"></script>
<script src="audio.js"></script>
<script src="game.js"></script>
</body>
</html>
